{{- if .Values.rag.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-rag
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-rag
  template:
    metadata:
      labels:
        {{- include "ops-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-rag
    spec:
      containers:
        - name: mcp-server
          image: {{ .Values.image.registry }}/ops-agent-rag:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: LLAMA_STACK_URL
              value: {{ .Values.rag.llamaStackUrl | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-rag
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: mcp-rag
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
{{- end }}
