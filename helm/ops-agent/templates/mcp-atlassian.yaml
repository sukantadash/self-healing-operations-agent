{{- if .Values.atlassian.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-atlassian
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-atlassian
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-atlassian
  template:
    metadata:
      labels:
        {{- include "ops-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-atlassian
    spec:
      containers:
        - name: mcp-server
          image: {{ .Values.atlassian.image }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: JIRA_URL
              value: {{ .Values.atlassian.jiraUrl | quote }}
            - name: CONFLUENCE_URL
              value: {{ .Values.atlassian.confluenceUrl | quote }}
            {{- if .Values.atlassian.credentialsSecret }}
            - name: JIRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.atlassian.credentialsSecret }}
                  key: username
            - name: JIRA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.atlassian.credentialsSecret }}
                  key: api-token
            - name: CONFLUENCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.atlassian.credentialsSecret }}
                  key: username
            - name: CONFLUENCE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.atlassian.credentialsSecret }}
                  key: api-token
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-atlassian
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: mcp-atlassian
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
{{- end }}
