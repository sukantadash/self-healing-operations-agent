{{- if .Values.governance.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-governance
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-governance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-governance
  template:
    metadata:
      labels:
        {{- include "ops-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-governance
    spec:
      containers:
        - name: mcp-server
          image: {{ .Values.image.registry }}/ops-agent-governance:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_RAG_URL
              value: "http://mcp-rag:8000/mcp"
            {{- if .Values.governance.nemoGuardrailsUrl }}
            - name: NEMO_GUARDRAILS_URL
              value: {{ .Values.governance.nemoGuardrailsUrl | quote }}
            - name: ENABLE_NEMO_GUARDRAILS
              value: "true"
            {{- end }}
            - name: MATURITY_THRESHOLD
              value: {{ .Values.maturityThreshold | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-governance
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ops-agent.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: mcp-governance
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
{{- end }}
