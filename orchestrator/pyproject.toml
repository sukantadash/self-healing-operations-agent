[project]
name = "ops-agent-orchestrator"
version = "0.1.0"
description = "Self-Healing OpenShift Operations Agent — LangGraph orchestrator"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "fastmcp>=2,<3",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
