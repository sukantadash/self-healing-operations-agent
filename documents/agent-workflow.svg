<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workflow</title>
  <desc id="desc">LangGraph agent flow with conditional routing and three execution paths.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#455a64"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#ef6c00"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <style>
      .tiny { font: 400 11px system-ui, sans-serif; fill: #607d8b; }
      .box-title { font: 600 13px system-ui, sans-serif; fill: #263238; }
      .path-label { font: 700 13px system-ui, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="340" fill="#f8fafc"/>

  <rect x="30" y="20" width="1220" height="300" rx="14" fill="#ffffff" stroke="#cfd8dc" stroke-width="2" filter="url(#shadow)"/>

  <!-- Main trunk -->
  <rect x="70" y="130" width="110" height="44" rx="8" fill="#bbdefb" stroke="#1565c0"/>
  <text x="125" y="157" text-anchor="middle" class="box-title">Monitor</text>

  <polygon points="230,152 250,172 230,192 210,172" fill="#eceff1" stroke="#78909c"/>

  <rect x="280" y="130" width="110" height="44" rx="8" fill="#bbdefb" stroke="#1565c0"/>
  <text x="335" y="157" text-anchor="middle" class="box-title">Diagnosis</text>

  <rect x="420" y="130" width="110" height="44" rx="8" fill="#bbdefb" stroke="#1565c0"/>
  <text x="475" y="157" text-anchor="middle" class="box-title">Governance</text>

  <polygon points="570,152 590,172 570,192 550,172" fill="#eceff1" stroke="#78909c"/>

  <!-- Path A -->
  <rect x="640" y="50" width="150" height="44" rx="8" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="715" y="77" text-anchor="middle" class="box-title">Resolution Gen</text>

  <rect x="820" y="50" width="140" height="44" rx="8" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="890" y="77" text-anchor="middle" class="box-title">Knowledge Curator</text>

  <rect x="990" y="50" width="110" height="44" rx="8" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="1045" y="77" text-anchor="middle" class="box-title">Ticket Agent</text>

  <ellipse cx="1180" cy="72" rx="48" ry="24" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="1180" y="77" text-anchor="middle" class="tiny">END</text>

  <!-- Path B -->
  <rect x="640" y="130" width="110" height="44" rx="8" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="695" y="157" text-anchor="middle" class="box-title">Ticket Agent</text>

  <ellipse cx="830" cy="152" rx="48" ry="24" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="830" y="157" text-anchor="middle" class="tiny">END</text>

  <!-- Path C -->
  <rect x="640" y="230" width="100" height="44" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="690" y="257" text-anchor="middle" class="box-title">Executor</text>

  <rect x="770" y="230" width="100" height="44" rx="8" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="820" y="257" text-anchor="middle" class="box-title">Feedback</text>

  <ellipse cx="960" cy="252" rx="48" ry="24" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="960" y="257" text-anchor="middle" class="tiny">END</text>

  <!-- Monitor clean exit -->
  <ellipse cx="230" cy="270" rx="48" ry="24" fill="#eceff1" stroke="#78909c"/>
  <text x="230" y="275" text-anchor="middle" class="tiny">END</text>

  <!-- Main trunk arrows -->
  <line x1="180" y1="152" x2="210" y2="172" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="250" y1="172" x2="280" y2="152" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="145" text-anchor="middle" class="tiny">errors_found</text>

  <path d="M 230 192 L 230 246" fill="none" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="220" class="tiny">no_errors</text>

  <line x1="390" y1="152" x2="420" y2="152" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="152" x2="550" y2="172" stroke="#455a64" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Path A arrows -->
  <path d="M 590 165 Q 610 72 640 72" fill="none" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="790" y1="72" x2="820" y2="72" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="960" y1="72" x2="990" y2="72" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="1100" y1="72" x2="1132" y2="72" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Path B arrows -->
  <line x1="590" y1="172" x2="640" y2="152" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="750" y1="152" x2="782" y2="152" stroke="#ef6c00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Path C arrows -->
  <path d="M 590 179 Q 610 252 640 252" fill="none" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="252" x2="770" y2="252" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="870" y1="252" x2="912" y2="252" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Routing labels -->
  <text x="560" y="165" text-anchor="middle" class="tiny">no_resolution</text>
  <text x="560" y="180" text-anchor="middle" class="tiny">immature</text>
  <text x="560" y="195" text-anchor="middle" class="tiny">mature</text>

  <!-- Path badges -->
  <rect x="600" y="28" width="52" height="22" rx="4" fill="#ef6c00"/>
  <text x="626" y="44" text-anchor="middle" class="path-label">A</text>

  <rect x="600" y="108" width="52" height="22" rx="4" fill="#ef6c00"/>
  <text x="626" y="124" text-anchor="middle" class="path-label">B</text>

  <rect x="600" y="208" width="52" height="22" rx="4" fill="#2e7d32"/>
  <text x="626" y="224" text-anchor="middle" class="path-label">C</text>
</svg>
